# Production values overlay. All image tags use empty strings by default —
# the release pipeline must inject actual tags via --set or Helm post-renderer.
featureMode: standard

gatewayAPI:
  installCRDs: false
  channel: standard

controlplane:
  replicas: 2
  image:
    tag: ""
    pullPolicy: IfNotPresent
  # Production: must set a bearerToken or use authMode: kubernetes
  config:
    adminAuth:
      authMode: "static"
      bearerToken: ""  # SET THIS to a strong random token
      bearerTokenFile: ""

dataplane:
  replicas: 2
  image:
    tag: ""
    pullPolicy: IfNotPresent

dashboard:
  enabled: true
  image:
    tag: ""
    pullPolicy: IfNotPresent
  ingress:
    enabled: false

networkPolicies:
  enabled: true

certs:
  generate: false
  certManager:
    enabled: false
