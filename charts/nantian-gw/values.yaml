# Default values for nantian-gw.
# This is a YAML-formatted file.

# -- Global settings applied across all components
global:
  # -- Global container image registry (prepended to all component images)
  imageRegistry: "ghcr.io"
  # -- Global image pull secrets (names of existing secrets)
  imagePullSecrets: []
# -- Common labels added to all resources
  commonLabels: {}

# -- Feature mode for the chart. Standard is the production default; experimental explicitly enables experimental runtime integration points.
# -- 功能模式。standard 是生产默认模式；experimental 用于显式开启实验性运行时集成点。
featureMode: standard

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the release
fullnameOverride: ""

# -- Gateway API configuration
# -- Gateway API 配置
gatewayAPI:
  # -- Install the standard Gateway API CRD bundle through Helm's crds/ path. Experimental adds only the extra experimental CRDs from templates.
  # -- 是否通过 Helm crds/ 机制安装 standard Gateway API CRD；experimental 只会额外渲染实验性增量 CRD。
  installCRDs: false
  # -- Gateway API CRD channel: standard installs the standard bundle; experimental installs the standard bundle plus experimental-only CRDs.
  # -- Gateway API CRD 通道：standard 安装标准 CRD；experimental 在标准 CRD 之上追加实验性增量 CRD。
  channel: standard

# -- Namespace configuration
namespace:
  # -- Create the namespace
  create: true
  # -- Namespace name (ignored if create=false, uses release namespace)
  name: "nantian-gw"

# -- GatewayClass resource
gatewayClass:
  enabled: true
  controllerName: "gateway.networking.k8s.io/nantian-gw"

# -- RBAC configuration (ServiceAccounts, ClusterRole, ClusterRoleBinding)
rbac:
  create: true

# =============================================================================
# Controlplane
# =============================================================================
controlplane:
  # -- Enable controlplane deployment
  enabled: true

  # -- Number of replicas
  replicas: 2

  # -- Container image
  image:
    # registry inherits from global.imageRegistry unless explicitly set
    repository: "nantian-gw/nantian-controlplane"
    tag: "latest"
    pullPolicy: Always

  # -- Pod security context (overrides defaults)
  podSecurityContext: {}
    # runAsNonRoot: true
    # runAsUser: 65532
    # runAsGroup: 65532
    # fsGroup: 65532

  # -- Container security context (overrides defaults)
  containerSecurityContext: {}
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6

  # -- Strategy for pods (defaults shown below, no 'pods' field needed in values)
  # strategy: {}  # Can be left empty to use defaults

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- PodDisruptionBudget
  pdb:
    # -- Minimum available pods during voluntary disruptions
    minAvailable: 1

  # -- Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 30

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

  # -- Controlplane application config (merged into ConfigMap as config.yaml)
  # @default -- See controlplane-config defaults below
  config:
    grpcAddr: ":18080"
    adminAddr: ":18081"
    metricsAddr: ":18082"
    healthProbeAddr: ":18083"
    controllerName: "gateway.networking.k8s.io/nantian-gw"
    statusAddress: "127.0.0.1"
    syncPeriod: "30s"
    syncSettleDelay: "200ms"
    nodeStatus:
      namespace: ""
      leasePrefix: "aeg-node"
      persistTimeout: "2s"
    adminRuntime:
      readHeaderTimeout: "5s"
      readTimeout: "30s"
      writeTimeout: "30s"
      idleTimeout: "2m"
    log:
      level: "info"
      format: "json"
    leaderElection:
      enabled: true
      id: "nantian-controlplane-leader"
      leaseDuration: "15s"
      renewDeadline: "10s"
      retryPeriod: "2s"
    adminAuth:
      bearerToken: ""
      # -- Empty value defaults to the chart-managed dataplane admin token file path when no inline bearer token is set.
      bearerTokenFile: ""
    grpcTLS:
      enabled: false
      certPath: ""
      keyPath: ""
      clientCAPath: ""
      requireClientCert: false
    grpcRuntime:
      keepaliveTime: "30s"
      keepaliveTimeout: "10s"
      minPingInterval: "15s"
      maxConnectionIdle: "2m"
      maxConnectionAge: "30m"
      maxConnectionAgeGrace: "30s"
      snapshotSendTimeout: "5s"
      snapshotAckTimeout: "30s"
      permitWithoutStream: false
    translatorLimits:
      maxInputObjects: 0
      maxSnapshotObjects: 0
      maxSnapshotEndpoints: 0
    nodeDrift:
      warningThreshold: "15s"
    reconcilerRunner:
      settleDelay: "300ms"
      retryBackoff: "1s"
    adminReadiness:
      mode: "snapshot"
    dashboardApi:
      enabled: true
      basePath: "/api/dashboard"
      # Empty value computes the in-cluster dataplane admin Service URL from the chart name and namespace.
      dataplaneAdminUrl: ""
      requestTimeout: "5s"
      resourceMutationsEnabled: true
    dashboard:
      # enabled defaults to .Values.dashboard.enabled when unset so the rendered controlplane policy
      # follows the chart-level dashboard deployment toggle by default.
      capabilities:
        aiOverview: true
        aiServices: true
        aiTokenPolicies: true
        aiCost: true
        aiTraces: true
        aiUsage: true
        wasmPlugins: true
        chatbot: true
    pprof:
      enabled: false
      addr: "127.0.0.1:6060"
    adminLimits:
      maxRequestBodyBytes: 2097152
      maxResponseBodyBytes: 8388608
    # -- Experimental feature flags. Enable at your own risk — these APIs may change.
    features:
      enableExperimentalGateway: false
      enableAiGateway: false

  # -- gRPC TLS configuration
  grpcTLS:
    # -- Enable gRPC mTLS
    enabled: false
    # -- Name of existing Secret containing tls.crt, tls.key, ca.crt
    existingSecret: ""
    # -- Require client certificates
    requireClientCert: false

  # -- Admin API authentication
  adminAuth:
    # -- Bearer token file path inside container
    bearerTokenFile: ""
    # -- Name of existing Secret containing the token
    existingSecret: ""
    # -- Secret key for the token (default: token)
    secretKey: "token"

  # -- Extra environment variables
  extraEnv: []
    # - name: FOO
    #   value: bar

  # -- Extra volume mounts
  extraVolumeMounts: []
  # -- Extra volumes
  extraVolumes: []

# =============================================================================
# Dataplane
# =============================================================================
dataplane:
  # -- Enable dataplane deployment
  enabled: true

  # -- Number of replicas
  replicas: 2

  # -- Container image
  image:
    # registry inherits from global.imageRegistry unless explicitly set
    repository: "nantian-gw/dataplane"
    tag: "latest"
    pullPolicy: Always

  # -- Pod security context (overrides defaults)
  podSecurityContext: {}
    # runAsNonRoot: true
    # runAsUser: 65532
    # runAsGroup: 65532
    # fsGroup: 65532

  # -- Container security context (overrides defaults)
  containerSecurityContext: {}
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true
    # capabilities:
    #   drop: [ALL]
    #   add: [NET_BIND_SERVICE]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 45
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- PodDisruptionBudget
  pdb:
    minAvailable: 1

  # -- Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 30

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

  # -- Dataplane application config (merged into ConfigMap as config.yaml)
  config:
    # -- Fallback dataplane nodeId. The chart injects AEG_NODE_ID from metadata.name,
    # -- so Kubernetes replicas use unique runtime node IDs by default.
    nodeId: "dp-kubernetes"
    cluster: "kubernetes"
    controlPlaneAddr: ""
    adminAddr: "0.0.0.0:19080"
    log:
      level: "info,nantian_core::connectors=off"
      format: "json"
      nonBlocking: true
      nonBlockingBufferedLines: 65536
      dropWhenFull: true
    adminAuth:
      bearerToken: ""
      bearerTokenFile: ""
    accessLog:
      enabled: true
      path: "/var/log/nantian-gw/access.log"
      format: "%CLIENT_IP% - - [%TIMESTAMP%] \"%REQUEST%\" %STATUS% %BYTES_SENT% \"%REFERER%\" \"%USER_AGENT%\" %LATENCY_MS%ms %UPSTREAM_ADDR% uct=%UPSTREAM_CONNECT_TIME_MS%ms rt=%ROUTE_NAMESPACE%/%ROUTE_NAME% rid=%REQUEST_ID% flags=%RESPONSE_FLAGS% retries=%RETRY_ATTEMPTS% sn=%SNAPSHOT_VERSION%"
      mode: "text"
      sampleRate: 1.0
    runtime:
      httpListenAddr: "0.0.0.0:10080"
      enableIpv6: false
      enableHttp3: false
      tlsMinVersion: "1.2"
      tlsMaxVersion: "1.3"
    runtimeTuning:
      gracefulDrainPeriodMs: 10000
      upstreamTcpFastOpen: true
      upstreamIdleTimeoutMs: 60000
      upstreamTcpKeepalive:
        enabled: true
      # High-concurrency tuning (commented = Nantian default)
      # workStealing: true
      # downstreamTcpFastopen: 1024       # TFO backlog; set to enable TCP Fast Open
      # downstreamDscp: 46               # DSCP EF for expedited forwarding
      # upstreamTcpRecvBuf: 262144       # 256KB socket receive buffer
      # upstreamTcpFastOpen: true
      # upstreamConnectionTimeoutMs: 5000
      # upstreamReadTimeoutMs: 30000
      # upstreamIdleTimeoutMs: 60000
      # upstreamDscp: 0
    xdsTls:
      enabled: false
      caPath: ""
      certPath: ""
      keyPath: ""
      domainName: ""

  # -- xDS TLS configuration
  xdsTLS:
    enabled: false
    # -- Name of existing Secret containing tls.crt, tls.key, ca.crt
    existingSecret: ""
    # -- Expected domain name for the controlplane gRPC service
    domainName: ""

  # -- Admin API authentication
  adminAuth:
    # -- Optional bearer token file path inside the dataplane container. When empty and no inline
    # -- dataplane.config.adminAuth.bearerToken is set, the chart defaults to a generated Secret-backed file path.
    bearerTokenFile: ""
    # -- Name of an existing Secret containing the dataplane admin bearer token. Leave empty to let the chart generate and reuse a stable Secret.
    existingSecret: ""
    # -- Secret key containing the dataplane admin bearer token.
    secretKey: "token"

  # -- Session persistence configuration
  sessionPersistence:
    # -- Shared secret for HMAC-based session keys (enables multi-replica safety).
    # -- When this chart mounts the Secret, it also wires dataplane sessionPersistence.secretKeyFile automatically.
    sharedSecret: ""
    # -- Name of existing Secret containing session persistence key. The mounted Secret is wired into
    # -- dataplane sessionPersistence.secretKeyFile automatically unless the runtime config overrides it.
    existingSecret: ""
    # -- Secret key for the session persistence token (default: session-persistence)
    secretKey: "session-persistence"

  # -- Chart-managed access log emptyDir. Disable when providing a custom log volume through extraVolumes/extraVolumeMounts.
  accessLogVolume:
    enabled: true
    name: access-logs
    mountPath: /var/log/nantian-gw
    sizeLimit: 256Mi

  # -- Extra environment variables
  extraEnv: []
  # -- Extra volume mounts
  extraVolumeMounts: []
  # -- Extra volumes
  extraVolumes: []

  # -- Host network mode (for Kind/low-port binding)
  hostNetwork: false

# =============================================================================
# Dashboard
# =============================================================================
dashboard:
  # -- Enable dashboard deployment
  enabled: true

  # -- Number of replicas
  replicas: 1

  # -- NextAuth secret value. Auto-generated if empty and no authExistingSecret.
  authSecret: ""

  # -- Name of a pre-created Secret (Opaque, key: auth-secret) for AUTH_SECRET.
  # Takes precedence over authSecret if both are set.
  authExistingSecret: ""

  # -- Dashboard ServiceAccount settings
  serviceAccount:
    # -- Create a dedicated dashboard ServiceAccount
    create: true
    # -- Existing ServiceAccount name. Empty uses the chart-generated dashboard name.
    name: ""
    # -- Automount Kubernetes API token into dashboard pods.
    automountServiceAccountToken: false

  # -- Dashboard Ingress settings. Disabled by default.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ""
    # -- Additional namespaces whose ingress controllers may reach the dashboard through NetworkPolicy.
    fromNamespaces: []

  # -- Container image
  image:
    # registry inherits from global.imageRegistry unless explicitly set
    repository: "nantian-gw/dashboard"
    tag: "latest"
    pullPolicy: Always

  # -- Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # -- Container security context
  containerSecurityContext: {}
    # allowPrivilegeEscalation: false
    # readOnlyRootFilesystem: true
    # capabilities:
    #   drop: [ALL]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 20
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- Topology spread constraints
  topologySpreadConstraints: []

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 20

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

# =============================================================================
# HPA (Horizontal Pod Autoscaler)
# =============================================================================
hpa:
  # -- Enable HPA for the dataplane
  enabled: false
  # -- Minimum replicas
  minReplicas: 2
  # -- Maximum replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilization: 70
  # -- Target memory utilization percentage
  targetMemoryUtilization: 75

# =============================================================================
# ServiceMonitor (Prometheus Operator)
# =============================================================================
serviceMonitor:
  # -- Enable ServiceMonitors for Prometheus operator scraping
  enabled: false
  # -- Labels added to ServiceMonitor resources
  labels: {}
    # release: kube-prometheus-stack
  # -- Scrape interval
  interval: "30s"
  # -- Scrape timeout
  scrapeTimeout: "10s"

# =============================================================================
# NetworkPolicy
# =============================================================================
networkPolicies:
  # -- Enable NetworkPolicies
  enabled: true

# =============================================================================
# Helm Tests
# =============================================================================
tests:
  # -- Enable Helm test hook rendering
  enabled: true
  image:
    repository: "busybox"
    tag: "1.36"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# =============================================================================
# Certificate generation (one-time, at install)
# =============================================================================
certs:
  # -- Generate self-signed certificates for gRPC mTLS.
  # When enabled, creates a CA, server cert, and client cert.
  # Disabled by default; use cert-manager or existingSecret values for production.
  generate: false
  # -- Namespace-scoped domain used for gRPC server certificate SAN.
  # Auto-computed from release name + namespace if empty.
  domain: ""
  selfSigned:
    caDurationDays: 365
    serverDurationDays: 90
    clientDurationDays: 90
  certManager:
    enabled: false
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    duration: 2160h
    renewBefore: 360h
