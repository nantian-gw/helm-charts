# Default values for nantian-gw.
# This is a YAML-formatted file.

# -- Global settings applied across all components
global:
  # -- Global container image registry (prepended to all component images)
  imageRegistry: "ghcr.io"
  # -- Global image pull secrets (names of existing secrets)
  imagePullSecrets: []
  # -- Name of an existing Kubernetes Secret containing all auto-generated
  # credentials. When set, the chart does not create any auto-generated secrets.
  # Production deployments must use an external secret manager (Sealed Secrets,
  # Vault, or cloud KMS) instead of relying on chart-generated secrets.
  existingSecret: ""
# -- Common labels added to all resources
  commonLabels: {}

# -- Feature mode for the chart. Standard is the production default; experimental explicitly enables experimental runtime integration points.
# -- 功能模式。standard 是生产默认模式；experimental 用于显式开启实验性运行时集成点。
featureMode: standard

# Boolean field naming conventions:
# - `enabled` is the standard toggle for components and features.
# - `create` indicates a Kubernetes resource should be created by the chart.
# - `generate` is used for auto-generation flags (e.g. certs.generate).
# - `install` signals Helm-managed installation of external resources (e.g. gatewayAPI.installCRDs).
# All boolean fields follow lowercase, verb-first naming for readability.

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the release
fullnameOverride: ""

# -- Gateway API configuration
# -- Gateway API 配置
gatewayAPI:
  # -- Install the standard Gateway API CRD bundle through Helm's crds/ path. Experimental adds only the extra experimental CRDs from templates.
  # -- 是否通过 Helm crds/ 机制安装 standard Gateway API CRD；experimental 只会额外渲染实验性增量 CRD。
  installCRDs: true
  # -- Gateway API CRD channel: standard installs the standard bundle; experimental installs the standard bundle plus experimental-only CRDs.
  # -- Gateway API CRD 通道：standard 安装标准 CRD；experimental 在标准 CRD 之上追加实验性增量 CRD。
  channel: standard

# -- Namespace configuration
namespace:
  # -- Create the namespace
  create: true
  # -- Namespace name (ignored if create=false, uses release namespace)
  name: "nantian-gw"
  # -- Pod Security Admission standards applied as labels on the created
  # namespace. Both planes are `restricted`-compliant. Set to null/{} to omit.
  podSecurityStandards:
    enforce: restricted
    enforceVersion: latest
    audit: restricted
    warn: restricted

# -- GatewayClass resource
gatewayClass:
  enabled: true
  controllerName: "gateway.networking.k8s.io/nantian-gw"

# -- RBAC configuration (ServiceAccounts, ClusterRole, ClusterRoleBinding)
rbac:
  create: true

# -- PriorityClass for control-plane and data-plane pods. Gateway is critical
# infrastructure, so its pods should schedule ahead of, and evict after,
# ordinary workloads. Set name to "" to disable; set create to false to
# reference a pre-existing PriorityClass by name.
priorityClass:
  create: true
  name: "nantian-gw-critical"
  # Kept below the built-in system-cluster-critical (2000000000) tier.
  value: 1000000000

# =============================================================================
# Controlplane
# =============================================================================
controlplane:
  # -- Enable controlplane deployment
  enabled: true

  # -- Number of replicas
  replicas: 2

  # -- Container image
  image:
    # registry inherits from global.imageRegistry unless explicitly set
    repository: "nantian-gw/nantian-controlplane"
    # For production, pin the exact digest instead of a mutable tag:
    # digest: "sha256:abc123..."
    tag: "latest"
    pullPolicy: IfNotPresent

  # -- Pod security context (overrides defaults)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context (overrides defaults)
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6

  # -- Strategy for pods (defaults shown below, no 'pods' field needed in values)
  # strategy: {}  # Can be left empty to use defaults

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- PodDisruptionBudget
  pdb:
    # -- Minimum available pods during voluntary disruptions
    minAvailable: 1

  # -- Topology spread constraints. For production HA, use DoNotSchedule to guarantee pods spread across nodes.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 30

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

  # -- Controlplane application config (merged into ConfigMap as config.yaml)
  # @default -- See controlplane-config defaults below
  config:
    grpcAddr: ":18080"
    adminAddr: ":18081"
    metricsAddr: ":18082"
    healthProbeAddr: ":18083"
    # controllerName is derived from gatewayClass.controllerName at render time
    # to keep a single source of truth.
    statusAddress: "127.0.0.1"
    syncPeriod: "30s"
    syncSettleDelay: "200ms"
    nodeStatus:
      namespace: ""
      leasePrefix: "nantian-gw-node"
      persistTimeout: "2s"
    adminRuntime:
      readHeaderTimeout: "5s"
      readTimeout: "30s"
      writeTimeout: "30s"
      idle_timeout: "2m"
    log:
      level: "info"
      format: "json"
    leaderElection:
      enabled: true
      id: "nantian-controlplane-leader"
      leaseDuration: "15s"
      renewDeadline: "10s"
      retryPeriod: "2s"
    adminAuth:
      # -- Authentication mode. "static" (default) uses a pre-configured bearer
      # token. "kubernetes" validates tokens via the Kubernetes TokenReview API,
      # allowing operators to authenticate with tokens generated by
      # `kubectl create token <service-account>`.
      authMode: "static"
      # -- Static bearer token for admin API access. Only used when
      # authMode is "static". Leave empty when using kubernetes mode.
      bearerToken: ""
      # -- Path to a file containing the static bearer token. Overrides
      # bearerToken if both are set. Only used when authMode is "static".
      bearerTokenFile: ""

      # SECURITY: When authMode is "static" and bearerToken is empty, the admin
      # API (port 18081) is accessible without authentication to any pod in the
      # same namespace. For production, either set a strong bearerToken or use
      # authMode: "kubernetes" with TokenReview validation.
    grpcTLS:
      enabled: false
      certPath: ""
      keyPath: ""
      clientCAPath: ""
      requireClientCert: false
    grpcRuntime:
      keepaliveTime: "30s"
      keepaliveTimeout: "10s"
      minPingInterval: "15s"
      maxConnectionIdle: "2m"
      maxConnectionAge: "30m"
      maxConnectionAgeGrace: "30s"
      snapshotSendTimeout: "5s"
      snapshotAckTimeout: "30s"
      permitWithoutStream: false
      xdsProtocol: sotw
    translatorLimits:
      maxInputObjects: 0
      maxSnapshotObjects: 0
      maxSnapshotEndpoints: 0
    nodeDrift:
      warningThreshold: "15s"
    reconcilerRunner:
      settleDelay: "300ms"
      retryBackoff: "1s"
    adminReadiness:
      mode: "snapshot"
    dashboardApi:
      enabled: true
      basePath: "/api/dashboard"
      # Empty value computes the in-cluster dataplane admin Service URL from the chart name and namespace.
      dataplaneAdminUrl: ""
      requestTimeout: "5s"
      resourceMutationsEnabled: true
    dashboard:
      # enabled defaults to .Values.dashboard.enabled when unset so the rendered controlplane policy
      # follows the chart-level dashboard deployment toggle by default.
      capabilities:
        aiOverview: true
        aiServices: true
        aiTokenPolicies: true
        aiCost: true
        aiTraces: true
        aiUsage: true
        wasmPlugins: true
        chatbot: true
    pprof:
      enabled: false
      addr: "127.0.0.1:6060"
    adminLimits:
      maxRequestBodyBytes: 2097152
      maxResponseBodyBytes: 8388608
    # -- Experimental feature flags. Enable at your own risk — these APIs may change.
    features:
      enableExperimentalGateway: false
      enableAiGateway: false

    # -- Infrastructure reconciler options controlling NodePort allocation
    # and dataplane admin port.
    infra:
      dataplaneAdminPort: 19080
      nodePortBasePrivileged: 30000
      nodePortBaseUDP: 31000
      nodePortBaseDefault: 32000
      nodePortRangeMax: 32767

  # -- gRPC TLS configuration
  grpcTLS:
    # -- Enable gRPC mTLS between controlplane and dataplane.
    # Requires certs.generate=true or an existingSecret to be set.
    enabled: false

  # -- Admin API authentication
  adminAuth:
    # -- Bearer token file path inside container
    bearerTokenFile: ""
    # -- Name of existing Secret containing the token
    existingSecret: ""
    # -- Secret key for the token (default: token)
    secretKey: "token"

  # -- Extra environment variables
  extraEnv: []
    # - name: FOO
    #   value: bar

  # -- Extra volume mounts
  extraVolumeMounts: []
  # -- Extra volumes
  extraVolumes: []

# =============================================================================
# Dataplane
# =============================================================================
dataplane:
  # -- Enable dataplane deployment
  enabled: true

  # -- Number of replicas
  replicas: 2

  # -- Container image
  image:
    # registry inherits from global.imageRegistry unless explicitly set
    repository: "nantian-gw/dataplane"
    # For production, pin the exact digest instead of a mutable tag:
    # digest: "sha256:abc123..."
    tag: "latest"
    pullPolicy: IfNotPresent

  # -- Pod security context (overrides defaults)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  # -- Container security context (overrides defaults)
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: [NET_BIND_SERVICE]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "1000m"
      memory: "256Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 45
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- PodDisruptionBudget. maxUnavailable keeps availability guarantees scaling
  # with the HPA (at most one dataplane pod disrupted at a time). Set
  # maxUnavailable to null and minAvailable to a value to switch back.
  pdb:
    maxUnavailable: 1

  # -- Topology spread constraints. For production HA, use DoNotSchedule to guarantee pods spread across nodes.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 30

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

  # -- Dataplane application config (merged into ConfigMap as config.yaml)
  config:
    # -- Fallback dataplane nodeId. The chart injects NANTIAN_GW_NODE_ID from metadata.name,
    # -- so Kubernetes replicas use unique runtime node IDs by default.
    node_id: "dp-kubernetes"
    cluster: "kubernetes"
    control_plane_addr: ""
    admin_addr: "0.0.0.0:19080"
    log:
      level: "info,nantian_core::connectors=off"
      format: "json"
      non_blocking: true
      non_blocking_buffered_lines: 65536
      drop_when_full: true
      # Sentry error/performance monitoring for the dataplane.
      # IMPORTANT: dsn is sensitive. Use existingSecret to inject it from
      # a pre-created Kubernetes Secret instead of setting dsn directly here.
      # The Secret must contain a key "sentry-dsn" with the DSN URL.
      sentry:
        enabled: false
        dsn: ""
        existing_secret: ""
        environment: ""
        sample_rate: 1.0
        traces_sample_rate: 0.01
        attach_stacktrace: true
        send_default_pii: false
        debug: false
    admin_auth:
      bearer_token: ""
      bearer_token_file: ""
    access_log:
      enabled: true
      path: "/var/log/nantian-gw/access.log"
      format: "%CLIENT_IP% - - [%TIMESTAMP%] \"%REQUEST%\" %STATUS% %BYTES_SENT% \"%REFERER%\" \"%USER_AGENT%\" %LATENCY_MS%ms %UPSTREAM_ADDR% uct=%UPSTREAM_CONNECT_TIME_MS%ms rt=%ROUTE_NAMESPACE%/%ROUTE_NAME% rid=%REQUEST_ID% flags=%RESPONSE_FLAGS% retries=%RETRY_ATTEMPTS% sn=%SNAPSHOT_VERSION%"
      mode: "text"
      sample_rate: 1.0
    runtime:
      http_listen_addr: ""
      enable_ipv6: false
      enable_http3: false
      tls_min_version: "1.2"
      tls_max_version: "1.3"
    runtime_tuning:
      graceful_drain_period_ms: 10000
      upstream_tcp_fast_open: true
      upstream_idle_timeout_ms: 60000
      upstream_tcp_keepalive:
        enabled: true
      # High-concurrency tuning (commented = Nantian default)
      # work_stealing: true
      # downstream_tcp_fastopen: 1024       # TFO backlog; set to enable TCP Fast Open
      # downstream_dscp: 46               # DSCP EF for expedited forwarding
      # upstream_tcp_recv_buf: 262144       # 256KB socket receive buffer
      # upstream_tcp_fast_open: true
      # upstream_connection_timeout_ms: 5000
      # upstream_read_timeout_ms: 30000
      # upstream_idle_timeout_ms: 60000
      # upstream_dscp: 0
    xds_tls:
      enabled: false
      ca_path: ""
      cert_path: ""
      key_path: ""
      domain_name: ""
    xds_protocol: sotw

  # -- xDS TLS configuration
  xdsTLS:
    # -- Enable mTLS for xDS connections to the controlplane.
    # Requires certs.generate=true or an existingSecret to be set.
    enabled: false
    existingSecret: ""
    # -- Expected domain name for the controlplane gRPC service
    domainName: ""

  # -- Admin API authentication
  adminAuth:
    # -- Optional bearer token file path inside the dataplane container. When empty and no inline
    # -- dataplane.config.adminAuth.bearerToken is set, the chart defaults to a generated Secret-backed file path.
    bearerTokenFile: ""
    # -- Name of an existing Secret containing the dataplane admin bearer token. Leave empty to let the chart generate and reuse a stable Secret.
    existingSecret: ""
    # -- Secret key containing the dataplane admin bearer token.
    secretKey: "token"

  # -- Session persistence configuration
  sessionPersistence:
    # -- Shared secret for HMAC-based session keys. Auto-generated on first install
    # -- when left empty; set explicitly for cross-cluster or pre-provisioned deployments.
    sharedSecret: ""
    # -- Name of existing Secret containing session persistence key. When set, the chart
    # -- skips auto-generation and uses this Secret instead.
    existingSecret: ""
    # -- Secret key for the session persistence token (default: session-persistence)
    secretKey: "session-persistence"

  # -- Chart-managed access log emptyDir. Disable when providing a custom log volume through extraVolumes/extraVolumeMounts.
  accessLogVolume:
    enabled: true
    name: access-logs
    mountPath: /var/log/nantian-gw
    sizeLimit: 256Mi

  # -- Extra environment variables
  extraEnv: []
  # -- Extra volume mounts
  extraVolumeMounts: []
  # -- Extra volumes
  extraVolumes: []

  # -- Host network mode (for Kind/low-port binding)
  hostNetwork: false

# =============================================================================
# Dashboard
# =============================================================================
dashboard:
  # -- Enable dashboard deployment
  enabled: true

  # -- Number of replicas
  replicas: 2

  # -- NextAuth secret value. Auto-generated if empty and no authExistingSecret.
  authSecret: ""

  # -- Name of a pre-created Secret (Opaque, key: auth-secret) for AUTH_SECRET.
  # Takes precedence over authSecret if both are set.
  authExistingSecret: ""

  # -- Enable HSTS (Strict-Transport-Security) header on dashboard responses.
  # Only enable when served exclusively over HTTPS.
  enableHSTS: false

  # -- Dashboard ServiceAccount settings
  serviceAccount:
    # -- Create a dedicated dashboard ServiceAccount
    create: true
    # -- Existing ServiceAccount name. Empty uses the chart-generated dashboard name.
    name: ""
    # -- Automount Kubernetes API token into dashboard pods.
    automountServiceAccountToken: false

  # -- Dashboard Ingress settings. Disabled by default.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    # -- Namespace where the Ingress Controller runs. Defaults to "ingress-nginx"
    # in the networkpolicy template when empty.
    namespace: ""
    tls: []
    # -- Additional namespaces whose ingress controllers may reach the dashboard through NetworkPolicy.
    fromNamespaces: []

  # -- Container image
  image:
    # registry inherits from global.imageRegistry unless explicitly set
    repository: "nantian-gw/dashboard"
    # For production, pin the exact digest instead of a mutable tag:
    # digest: "sha256:abc123..."
    tag: "latest"
    pullPolicy: IfNotPresent

  # -- Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  # -- Resource requests and limits
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  # -- Probe configuration
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 20
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3

  # -- Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- PodDisruptionBudget
  pdb:
    # -- Minimum available pods during voluntary disruptions
    minAvailable: 1

  # -- Topology spread constraints. For production HA, use DoNotSchedule to guarantee pods spread across nodes.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

  # -- Termination grace period (seconds)
  terminationGracePeriodSeconds: 20

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

# =============================================================================
# HPA (Horizontal Pod Autoscaler)
# =============================================================================
hpa:
  # -- Enable HPA for the dataplane, controlplane, and dashboard
  enabled: false
  # -- Target CPU utilization percentage
  targetCPUUtilization: 70
  # -- Target memory utilization percentage
  targetMemoryUtilization: 75
  dataplane:
    minReplicas: 2
    maxReplicas: 10
  controlplane:
    minReplicas: 2
    maxReplicas: 5
  dashboard:
    minReplicas: 2
    maxReplicas: 5
  # -- Scaling behavior applied to all HPAs (stabilization windows avoid
  # flapping). Set to null/{} to use the Kubernetes defaults.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# =============================================================================
# ServiceMonitor (Prometheus Operator)
# =============================================================================
serviceMonitor:
  # -- Enable ServiceMonitors for Prometheus operator scraping
  enabled: false
  # -- Labels added to ServiceMonitor resources
  labels: {}
    # release: kube-prometheus-stack
  # -- Additional namespaces whose Prometheus pods may reach metrics endpoints through NetworkPolicy.
  # -- Dataplane metrics share the admin port, so only grant trusted monitoring namespaces.
  fromNamespaces: []
  # -- Scrape interval
  interval: "30s"
  # -- Scrape timeout
  scrapeTimeout: "10s"

# =============================================================================
# Observability
# =============================================================================
observability:
  # -- PrometheusRule alert rules for the Nantian GW control plane and data plane
  alerts:
    # -- Enable PrometheusRule creation (requires Prometheus Operator)
    enabled: false

  # -- Grafana dashboard configuration
  grafana:
    dashboards:
      # -- Enable Grafana dashboard ConfigMap (requires grafana_dashboard label sidecar)
      enabled: false

# =============================================================================
# NetworkPolicy
# =============================================================================
networkPolicies:
  # -- Enable NetworkPolicies
  enabled: true
  # -- Enable egress rules. When enabled, restricts outbound traffic to only
  # what each component needs (DNS, K8s API, internal services). Controlplane
  # and dashboard get restrictive egress rules; dataplane is intentionally
  # excluded because it needs to reach arbitrary upstream backends.
  # Set to true in production for defense-in-depth.
  egress:
    enabled: false

# =============================================================================
# Helm Tests
# =============================================================================
tests:
  # -- Enable Helm test hook rendering
  enabled: true
  image:
    repository: "public.ecr.aws/docker/library/busybox"
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# =============================================================================
# Certificate generation (one-time, at install)
# =============================================================================
# Secret Rotation Best Practices
# ------------------------------
# - Rotate certificates at least 15 days before expiry. The default server cert
#   lifetime is 90 days (see selfSigned.serverDurationDays).
# - Store production certs in an external secret manager (Sealed Secrets, ESO,
#   Vault, or cloud KMS). Set certs.generate=false and reference the external
#   Secret via controlplane.grpcTLS.existingSecret and
#   dataplane.xdsTLS.existingSecret.
# - After rotating the Secret, restart affected Pods so they pick up the new
#   cert material:
#     kubectl rollout restart deployment -n <ns> -l app.kubernetes.io/component=controlplane
#     kubectl rollout restart daemonset  -n <ns> -l app.kubernetes.io/component=dataplane
# - Never commit plain Secret YAML to Git. Use SealedSecret or ExternalSecret
#   CRDs for GitOps-friendly secret management.
# - See examples/secrets-management.md for detailed walkthroughs.
certs:
  # -- Generate self-signed certificates for gRPC mTLS.
  # When enabled, creates a CA, server cert, and client cert.
  # Set to false and use certManager or existingSecret for production.
  generate: true
  # -- Namespace-scoped domain used for gRPC server certificate SAN.
  # Auto-computed from release name + namespace if empty.
  domain: ""
  selfSigned:
    caDurationDays: 365
    serverDurationDays: 90
    clientDurationDays: 90
  certManager:
    enabled: false
    issuerRef:
      name: ""
      kind: Issuer
