apiVersion: v2
name: nantian-gw
description: Nantian Gateway - Kubernetes Gateway API implementation with Go control plane and Rust/Nantian data plane
type: application
# Version 0.4.0-alpha.1 — pre-1.0 because the chart API is still evolving.
# Production readiness items remain: external secret manager integration,
# digest-pinned image defaults, and conformance validation across all
# supported Kubernetes versions. Bump to 1.0.0 once these are resolved.
version: 0.4.0-alpha.1
appVersion: "2026.08.0-alpha.1"
keywords:
  - gateway
  - gateway-api
  - nantian
  - rust
  - kubernetes
icon: https://raw.githubusercontent.com/nantian-gw/nantian-gw/main/logo.png
home: https://github.com/nantian-gw/gateway
sources:
  - https://github.com/nantian-gw/gateway
maintainers:
  - name: Nantian Gateway Maintainers
dependencies:
  - name: gateway-api-crds-standard
    version: 0.1.0
    repository: "file://./charts/gateway-api-crds-standard"
    condition: gatewayAPI.installCRDs
