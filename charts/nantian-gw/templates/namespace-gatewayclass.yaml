{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    {{- with .Values.namespace.podSecurityStandards }}
    pod-security.kubernetes.io/enforce: {{ .enforce }}
    pod-security.kubernetes.io/enforce-version: {{ .enforceVersion | default "latest" }}
    pod-security.kubernetes.io/audit: {{ .audit | default .enforce }}
    pod-security.kubernetes.io/warn: {{ .warn | default .enforce }}
    {{- end }}
{{- end }}
---
{{- if .Values.gatewayClass.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.controllerName | replace "gateway.networking.k8s.io/" "" | replace "." "-" }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
{{- end }}