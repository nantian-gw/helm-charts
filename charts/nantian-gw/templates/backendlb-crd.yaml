{{- if eq .Values.featureMode "experimental" }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: "https://github.com/nantian-gw/gateway/pull/1"
  name: backendlbpolicies.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  names:
    plural: backendlbpolicies
    singular: backendlbpolicy
    kind: BackendLBPolicy
    listKind: BackendLBPolicyList
  scope: Namespaced
  versions:
  - name: v1alpha2
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [targetRefs]
            properties:
              targetRefs:
                type: array
                items:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
              sessionPersistence:
                type: object
                properties:
                  sessionName:
                    type: string
                  type:
                    type: string
                    enum: [Cookie, Header]
                  absoluteTimeout:
                    type: string
                  idleTimeout:
                    type: string
                  cookieConfig:
                    type: object
                    properties:
                      lifetimeType:
                        type: string
                        enum: [Permanent, Session]
              loadBalancing:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - RoundRobin
                    - ConsistentHash
                    - LeastRequest
                    - Random
                  consistentHash:
                    type: object
                    properties:
                      keyType:
                        type: string
                        enum:
                        - SourceIP
                        - Header
                        - Hostname
                      headerName:
                        type: string
                  slowStart:
                    type: object
                    properties:
                      window:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
              circuitBreaker:
                type: object
                properties:
                  maxInflightRequests:
                    type: integer
                    format: int32
              healthCheck:
                type: object
                properties:
                  type:
                    type: string
                    enum: [TCP, HTTP, GRPC]
                  path:
                    type: string
                  expectedStatus:
                    type: integer
                    minimum: 100
                    maximum: 599
                  interval:
                    type: string
                    pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                  timeout:
                    type: string
                    pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                  healthyThreshold:
                    type: integer
                    minimum: 1
                  unhealthyThreshold:
                    type: integer
                    minimum: 1
              outlierDetection:
                type: object
                properties:
                  consecutive5xx:
                    type: integer
                    minimum: 1
                  interval:
                    type: string
                    pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                  baseEjectionTime:
                    type: string
                    pattern: '^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$'
                  maxEjectionPercent:
                    type: integer
                    minimum: 1
                    maximum: 100
          status:
            type: object
            properties:
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                  - type
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type:
                      type: string
                      maxLength: 316
                      pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$"
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                    message:
                      type: string
                      maxLength: 32768
{{- end }}
