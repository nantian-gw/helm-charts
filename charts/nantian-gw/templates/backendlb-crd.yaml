{{- if eq .Values.featureMode "experimental" }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backendlbpolicies.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  names:
    plural: backendlbpolicies
    singular: backendlbpolicy
    kind: BackendLBPolicy
    listKind: BackendLBPolicyList
  scope: Namespaced
  versions:
  - name: v1alpha2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [targetRefs]
            properties:
              targetRefs:
                type: array
                items:
                  type: object
                  required: [group, kind, name]
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
              sessionPersistence:
                type: object
                properties:
                  sessionName:
                    type: string
                  type:
                    type: string
                    enum: [Cookie, Header]
                  absoluteTimeout:
                    type: string
                  idleTimeout:
                    type: string
                  cookieConfig:
                    type: object
                    properties:
                      lifetimeType:
                        type: string
                        enum: [Permanent, Session]
              loadBalancing:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - RoundRobin
                    - ConsistentHash
                    - LeastRequest
                    - Random
                  consistentHash:
                    type: object
                    properties:
                      keyType:
                        type: string
                        enum:
                        - SourceIP
                        - Header
                        - Hostname
                      headerName:
                        type: string
              circuitBreaker:
                type: object
                properties:
                  maxInflightRequests:
                    type: integer
                    format: int32
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
{{- end }}
