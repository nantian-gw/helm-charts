{{- if not .Values.gatewayAPI.installCRDs }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nantian-gw.fullname" . }}-prereq-check
  namespace: {{ include "nantian-gw.namespace" . }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "nantian-gw.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "nantian-gw.fullname" . }}-controlplane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: check
        image: "registry.k8s.io/kubectl:v1.32.0"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        args:
        - get
        - crd
        - gatewayclasses.gateway.networking.k8s.io
        - gateways.gateway.networking.k8s.io
        - httproutes.gateway.networking.k8s.io
{{- end }}
