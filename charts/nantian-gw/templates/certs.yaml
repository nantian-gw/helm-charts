{{- if .Values.certs.generate }}
{{- $ns := include "nantian-gw.namespace" . }}
{{- $name := include "nantian-gw.name" . }}
{{- $domain := .Values.certs.domain | default (printf "%s-controlplane.%s.svc.cluster.local" $name $ns) }}
{{- $caSecretName := printf "%s-grpc-ca" $name }}
{{- $serverSecretName := printf "%s-grpc-server-tls" $name }}
{{- $clientSecretName := printf "%s-grpc-client-tls" $name }}
{{- $existingCA := lookup "v1" "Secret" $ns $caSecretName }}
{{- $existingServer := lookup "v1" "Secret" $ns $serverSecretName }}
{{- $existingClient := lookup "v1" "Secret" $ns $clientSecretName }}
{{- $reuseExisting := and $existingCA $existingServer $existingClient }}
{{- $ca := genCA (printf "%s-ca" $name) (int .Values.certs.selfSigned.caDurationDays) }}
{{- if and $existingCA $existingCA.data (index $existingCA.data "tls.crt") (index $existingCA.data "tls.key") -}}
{{- $ca = buildCustomCert (index $existingCA.data "tls.crt") (index $existingCA.data "tls.key") -}}
{{- end -}}
{{- $serverCert := genSignedCert $domain nil (list $domain) (int .Values.certs.selfSigned.serverDurationDays) $ca }}
{{- $clientCert := genSignedCert (printf "%s-client" $name) nil nil (int .Values.certs.selfSigned.clientDurationDays) $ca }}
{{- $serverCA := "" -}}
{{- if and $reuseExisting $existingServer $existingServer.data -}}
{{- $serverCA = (index $existingServer.data "ca.crt" | default "") -}}
{{- end -}}
{{- if and $reuseExisting (not $serverCA) $existingClient $existingClient.data -}}
{{- $serverCA = (index $existingClient.data "ca.crt" | default "") -}}
{{- end -}}
{{- if and (not $serverCA) $existingCA $existingCA.data -}}
{{- $serverCA = (index $existingCA.data "tls.crt" | default "") -}}
{{- end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-ca
  annotations:
    "helm.sh/resource-policy": "keep"
type: kubernetes.io/tls
data:
  tls.crt: {{ if $reuseExisting }}{{ index $existingCA.data "tls.crt" }}{{ else }}{{ $ca.Cert | b64enc }}{{ end }}
  tls.key: {{ if $reuseExisting }}{{ index $existingCA.data "tls.key" }}{{ else }}{{ $ca.Key | b64enc }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $serverSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-server
  annotations:
    "helm.sh/resource-policy": "keep"
type: kubernetes.io/tls
data:
  tls.crt: {{ if $reuseExisting }}{{ index $existingServer.data "tls.crt" }}{{ else }}{{ $serverCert.Cert | b64enc }}{{ end }}
  tls.key: {{ if $reuseExisting }}{{ index $existingServer.data "tls.key" }}{{ else }}{{ $serverCert.Key | b64enc }}{{ end }}
  ca.crt: {{ if $serverCA }}{{ $serverCA }}{{ else }}{{ $ca.Cert | b64enc }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clientSecretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-client
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  ca.crt: {{ if $reuseExisting }}{{ index $existingClient.data "ca.crt" }}{{ else }}{{ $ca.Cert | b64enc }}{{ end }}
  tls.crt: {{ if $reuseExisting }}{{ index $existingClient.data "tls.crt" }}{{ else }}{{ $clientCert.Cert | b64enc }}{{ end }}
  tls.key: {{ if $reuseExisting }}{{ index $existingClient.data "tls.key" }}{{ else }}{{ $clientCert.Key | b64enc }}{{ end }}
{{- end }}
