                      default: "gateway.networking.k8s.io"
                    kind:
                      type: string
                      maxLength: 63
                      enum: [Gateway, HTTPRoute]
                    name:
                      type: string
                      maxLength: 253
                  x-kubernetes-preserve-unknown-fields: true
              default:
                type: object
                properties:
                  timeout:
                    type: object
                    properties:
                      request:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(h|m|s|ms))+$'
                      backendRequest:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(h|m|s|ms))+$'
                      connect:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(h|m|s|ms))+$'
                      nextUpstream:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(h|m|s|ms))+$'
                  bodyLimit:
                    type: object
                    properties:
                      maxRequestBodyBytes:
                        type: integer
                        format: int64
                        minimum: 0
                      requestBodyBufferBytes:
                        type: integer
                        format: int64
                        minimum: 0
                      maxRequestHeaderBytes:
                        type: integer
                        format: int64
                        minimum: 0
                  proxy:
                    type: object
                    properties:
                      requestBuffering:
                        type: boolean
                      responseBuffering:
                        type: boolean
                      bufferSize:
                        type: integer
                        format: int64
                        minimum: 0
                      bufferCount:
                        type: integer
                        format: int32
                        minimum: 0
                  connection:
                    type: object
                    properties:
                      keepaliveRequests:
                        type: integer
                        format: int32
                        minimum: 0
                      keepaliveTime:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(h|m|s|ms))+$'
                      keepaliveTimeout:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(h|m|s|ms))+$'
                      upstreamKeepalivePoolSize:
                        type: integer
                        format: int32
                        minimum: 0
                      upstreamKeepaliveIdle:
                        type: string
                        pattern: '^([0-9]+(\.[0-9]+)?(h|m|s|ms))+$'
