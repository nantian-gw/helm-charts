                      type: string
                      enum: ["True", "False", "Unknown"]
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      pattern: "^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$"
                    message:
