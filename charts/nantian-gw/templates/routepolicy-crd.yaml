{{- if eq .Values.featureMode "experimental" }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routepolicies.gateway.nantian.dev
spec:
  group: gateway.nantian.dev
  names:
    plural: routepolicies
    singular: routepolicy
    kind: RoutePolicy
    listKind: RoutePolicyList
  scope: Namespaced
  versions:
  - name: v1alpha1
