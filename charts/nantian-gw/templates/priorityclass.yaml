{{- if and .Values.priorityClass.create .Values.priorityClass.name }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
description: "Priority class for nantian-gw control-plane and data-plane pods."
{{- end }}
