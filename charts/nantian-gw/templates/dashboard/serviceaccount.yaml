{{- if and .Values.dashboard.enabled .Values.dashboard.serviceAccount.create }}
{{- $ns := include "nantian-gw.namespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nantian-gw.dashboard.serviceAccountName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dashboard.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.dashboard.serviceAccount.automountServiceAccountToken }}
{{- end }}
