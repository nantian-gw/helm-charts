{{- if and .Values.dashboard.enabled .Values.dashboard.ingress.enabled }}
{{- $ns := include "nantian-gw.namespace" . }}
{{- $name := include "nantian-gw.name" . }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dashboard.labels" . | nindent 4 }}
  {{- with .Values.dashboard.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.dashboard.ingress.className }}
  ingressClassName: {{ .Values.dashboard.ingress.className | quote }}
  {{- end }}
  {{- if .Values.dashboard.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.dashboard.ingress.tls.secretName | quote }}
      {{- if .Values.dashboard.ingress.host }}
      hosts:
        - {{ .Values.dashboard.ingress.host | quote }}
      {{- end }}
  {{- end }}
  rules:
    - {{- if .Values.dashboard.ingress.host }}
      host: {{ .Values.dashboard.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.dashboard.ingress.path | quote }}
            pathType: {{ .Values.dashboard.ingress.pathType }}
            backend:
              service:
                name: {{ $name }}-dashboard
                port:
                  number: 3000
{{- end }}
