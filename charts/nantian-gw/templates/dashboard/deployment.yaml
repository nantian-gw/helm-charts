{{- if .Values.dashboard.enabled }}
{{- $ns := include "nantian-gw.namespace" . }}
{{- $dbName := include "nantian-gw.name" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $dbName }}-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dashboard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.dashboard.replicas }}
  {{- end }}
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.dashboard.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "nantian-gw.dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nantian-gw.dashboard.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nantian-gw.dashboard.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.dashboard.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.dashboard.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.dashboard.podSecurityContext | nindent 8 }}
      {{- if .Values.dashboard.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.dashboard.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "nantian-gw.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ include "nantian-gw.dashboard.image" . }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.dashboard.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.dashboard.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.dashboard.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.dashboard.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.dashboard.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.dashboard.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.dashboard.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.dashboard.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          {{- if .Values.dashboard.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.dashboard.containerSecurityContext | nindent 12 }}
          {{- else }}
          {{- include "nantian-gw.containerSecurityContext" . | nindent 10 }}
          {{- end }}
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dashboard.authExistingSecret | default (printf "%s-%s" (include "nantian-gw.name" .) "dashboard-auth") }}
                  key: auth-secret
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: CONTROLPLANE_ADMIN_URL
              value: "http://{{ include "nantian-gw.name" . }}-controlplane.{{ include "nantian-gw.namespace" . }}.svc.cluster.local:18081"
            - name: DATAPLANE_ADMIN_URL
              value: "http://{{ include "nantian-gw.name" . }}-dataplane-admin.{{ include "nantian-gw.namespace" . }}.svc.cluster.local:19080"
            {{- if and .Values.dataplane.enabled (eq (include "nantian-gw.dataplaneAdminAuthUsesSecret" .) "true") }}
            # Inject the dataplane admin bearer token so the dashboard BFF can
            # proxy to dataplane admin endpoints, which use a different token
            # than the controlplane admin the dashboard session authenticates with.
            - name: DATAPLANE_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nantian-gw.dataplaneAdminAuthSecretName" . }}
                  key: {{ .Values.dataplane.adminAuth.secretKey }}
            {{- end }}
            {{- if .Values.dashboard.enableHSTS }}
            - name: DASHBOARD_ENABLE_HSTS
              value: "true"
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
