{{- if .Values.observability.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nantian-gw.fullname" . }}-grafana-dashboards
  namespace: {{ include "nantian-gw.namespace" . }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  nantian-gw-overview.json: |
{{ .Files.Get "dashboards/overview.json" | indent 4 }}
{{- end }}
