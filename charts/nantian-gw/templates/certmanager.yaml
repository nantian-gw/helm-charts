{{- if .Values.certs.certManager.enabled }}
{{- $ns := include "nantian-gw.namespace" . }}
{{- $name := include "nantian-gw.name" . }}
{{- $domain := .Values.certs.domain | default (printf "%s-controlplane-grpc.%s.svc.cluster.local" $name $ns) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-grpc-server-tls
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-server
spec:
  secretName: {{ $name }}-grpc-server-tls
  duration: {{ .Values.certs.certManager.duration | quote }}
  renewBefore: {{ .Values.certs.certManager.renewBefore | quote }}
  dnsNames:
    - {{ $domain | quote }}
    - {{ printf "%s-controlplane-grpc" $name | quote }}
    - {{ printf "%s-controlplane-grpc.%s" $name $ns | quote }}
    - {{ printf "%s-controlplane-grpc.%s.svc" $name $ns | quote }}
    - {{ printf "%s-controlplane-grpc.%s.svc.cluster.local" $name $ns | quote }}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: {{ .Values.certs.certManager.issuerRef.name | quote }}
    kind: {{ .Values.certs.certManager.issuerRef.kind | quote }}
    group: {{ .Values.certs.certManager.issuerRef.group | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}-grpc-client-tls
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.labels" . | nindent 4 }}
    gateway.nantian.dev/secret-role: grpc-client
spec:
  secretName: {{ $name }}-grpc-client-tls
  duration: {{ .Values.certs.certManager.duration | quote }}
  renewBefore: {{ .Values.certs.certManager.renewBefore | quote }}
  commonName: {{ printf "%s-dataplane" $name | quote }}
  usages:
    - digital signature
    - key encipherment
    - client auth
  issuerRef:
    name: {{ .Values.certs.certManager.issuerRef.name | quote }}
    kind: {{ .Values.certs.certManager.issuerRef.kind | quote }}
    group: {{ .Values.certs.certManager.issuerRef.group | quote }}
{{- end }}
