{{- $ns := include "nantian-gw.namespace" . }}

{{/* Generate session persistence secret when no existingSecret is provided (auto-generates if sharedSecret is also empty) */}}
{{- if and .Values.dataplane.enabled (not .Values.dataplane.sessionPersistence.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nantian-gw.name" . }}-dataplane-session-persistence
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dataplane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  {{ .Values.dataplane.sessionPersistence.secretKey }}: {{ include "nantian-gw.session-persistence-secret" . | quote }}
---
{{- end }}

{{/* Generate dashboard auth secret when no existingSecret is provided */}}
{{- if and .Values.dashboard.enabled (not .Values.dashboard.authExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nantian-gw.name" . }}-dashboard-auth
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dashboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  auth-secret: {{ include "nantian-gw.dashboard-auth-secret" . | quote }}
---
{{- end }}

{{/* Generate dataplane admin auth secret when the chart manages the token */}}
{{- if and (eq (include "nantian-gw.dataplaneAdminAuthUsesSecret" .) "true") (not .Values.dataplane.adminAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nantian-gw.dataplaneAdminAuthSecretName" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dataplane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  {{ .Values.dataplane.adminAuth.secretKey }}: {{ include "nantian-gw.dataplane-admin-auth-token" . | quote }}
---
{{- end }}

{{/* Reference note: TLS and admin-auth secrets should be pre-created by the user.
     Set controlplane.grpcTLS.existingSecret, dataplane.xdsTLS.existingSecret,
     controlplane.adminAuth.existingSecret, dataplane.adminAuth.existingSecret
     to point to pre-existing secrets. */}}
