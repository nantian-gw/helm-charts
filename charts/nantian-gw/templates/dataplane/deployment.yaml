{{- if .Values.dataplane.enabled }}
{{- $ns := include "nantian-gw.namespace" . }}
{{- $dpName := include "nantian-gw.name" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $dpName }}-dataplane
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dataplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dataplane.replicas }}
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    {{- toYaml .Values.dataplane.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "nantian-gw.dataplane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nantian-gw.dataplane.labels" . | nindent 8 }}
      {{- with .Values.dataplane.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $dpName }}-dataplane
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.dataplane.terminationGracePeriodSeconds }}
      {{- if .Values.dataplane.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.dataplane.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.dataplane.podSecurityContext | nindent 8 }}
      {{- else }}
      {{- include "nantian-gw.dataplanePodSecurityContext" . | nindent 6 }}
      {{- end }}
      {{- if .Values.dataplane.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.dataplane.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "nantian-gw.dataplane.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- with .Values.dataplane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dataplane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dataplane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "nantian-gw.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: dataplane
          image: {{ include "nantian-gw.dataplane.image" . }}
          imagePullPolicy: {{ .Values.dataplane.image.pullPolicy }}
          env:
            - name: NANTIAN_GW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AEG_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.dataplane.config.log.sentry.enabled }}
            {{- if .Values.dataplane.config.log.sentry.existingSecret }}
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dataplane.config.log.sentry.existingSecret }}
                  key: sentry-dsn
            {{- end }}
            {{- end }}
            {{- with .Values.dataplane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          args:
            - "--config"
            - "/etc/nantian-gw/config.yaml"
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 19080
          startupProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: {{ .Values.dataplane.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.dataplane.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: {{ .Values.dataplane.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.dataplane.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.dataplane.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: {{ .Values.dataplane.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.dataplane.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.dataplane.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.dataplane.resources | nindent 12 }}
          {{- if .Values.dataplane.containerSecurityContext }}
          securityContext:
            {{- toYaml .Values.dataplane.containerSecurityContext | nindent 12 }}
          {{- else }}
          {{- include "nantian-gw.dataplaneContainerSecurityContext" . | nindent 10 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/nantian-gw
              readOnly: true
            {{- if or .Values.dataplane.xdsTLS.enabled .Values.certs.generate .Values.certs.certManager.enabled }}
            - name: xds-tls
              mountPath: /etc/nantian-gw/xds-tls
              readOnly: true
            {{- end }}
            {{- if eq (include "nantian-gw.dataplaneAdminAuthUsesSecret" .) "true" }}
            - name: admin-auth
              mountPath: {{ dir (include "nantian-gw.dataplaneAdminAuthFilePath" .) }}
              readOnly: true
            {{- end }}
            - name: session-persistence
              mountPath: /etc/nantian-gw/session-persistence
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- $accessLogMountExists := false }}
            {{- range .Values.dataplane.extraVolumeMounts }}
            {{- if or (eq .name $.Values.dataplane.accessLogVolume.name) (eq .mountPath $.Values.dataplane.accessLogVolume.mountPath) }}
            {{- $accessLogMountExists = true }}
            {{- end }}
            {{- end }}
            {{- if and .Values.dataplane.accessLogVolume.enabled (not $accessLogMountExists) }}
            - name: {{ .Values.dataplane.accessLogVolume.name }}
              mountPath: {{ .Values.dataplane.accessLogVolume.mountPath }}
            {{- end }}
            {{- with .Values.dataplane.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $dpName }}-dataplane-config
        {{- if or .Values.dataplane.xdsTLS.enabled .Values.certs.generate .Values.certs.certManager.enabled }}
        - name: xds-tls
          secret:
            secretName: {{ .Values.dataplane.xdsTLS.existingSecret | default (printf "%s-grpc-client-tls" $dpName) }}
        {{- end }}
        {{- if eq (include "nantian-gw.dataplaneAdminAuthUsesSecret" .) "true" }}
        - name: admin-auth
          secret:
            secretName: {{ include "nantian-gw.dataplaneAdminAuthSecretName" . }}
            items:
              - key: {{ .Values.dataplane.adminAuth.secretKey }}
                path: {{ base (include "nantian-gw.dataplaneAdminAuthFilePath" .) }}
        {{- end }}
        - name: session-persistence
          secret:
            {{- if .Values.dataplane.sessionPersistence.existingSecret }}
            secretName: {{ .Values.dataplane.sessionPersistence.existingSecret }}
            {{- else }}
            secretName: {{ $dpName }}-dataplane-session-persistence
            {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- $accessLogVolumeExists := false }}
        {{- range .Values.dataplane.extraVolumes }}
        {{- if eq .name $.Values.dataplane.accessLogVolume.name }}
        {{- $accessLogVolumeExists = true }}
        {{- end }}
        {{- end }}
        {{- if and .Values.dataplane.accessLogVolume.enabled (not $accessLogVolumeExists) }}
        - name: {{ .Values.dataplane.accessLogVolume.name }}
          emptyDir:
            sizeLimit: {{ .Values.dataplane.accessLogVolume.sizeLimit }}
        {{- end }}
        {{- with .Values.dataplane.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
