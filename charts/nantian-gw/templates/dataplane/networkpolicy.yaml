{{- if and .Values.dataplane.enabled .Values.networkPolicies.enabled }}
{{- $ns := include "nantian-gw.namespace" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nantian-gw.name" . }}-dataplane
  namespace: {{ $ns }}
  labels:
    {{- include "nantian-gw.dataplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nantian-gw.dataplane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
      ports:
        - protocol: TCP
          port: 19080
    {{- range .Values.serviceMonitor.fromNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 19080
    {{- end }}
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
{{- end }}
