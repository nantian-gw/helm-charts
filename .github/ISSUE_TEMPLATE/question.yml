name: Question
description: Ask about Helm chart usage, configuration, or deployment.
title: "[Question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Chinese.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - installation / deployment
        - configuration / values
        - upgrade / migration
        - other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: Explain what you are trying to do and what you already tried.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      placeholder: |
        - Helm version:
        - Kubernetes version:
        - Values file:
