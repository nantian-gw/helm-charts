name: Feature Request
description: Suggest a new chart, value option, or deployment improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Chinese.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - charts
        - templates
        - values / configuration
        - release / CI
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      placeholder: What is missing or could be improved.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      placeholder: Describe the new chart, value, or template change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the existing issues for similar requests.
          required: true
