name: Chart CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Validate version docs
        run: bash scripts/test-version-docs.sh

      - name: Validate chart production renders
        run: bash scripts/validate-chart-production.sh

      - name: Validate snapshot packaging
        run: bash scripts/test-package-snapshot-charts.sh

      - name: Lint chart
        run: helm lint charts/nantian-gw

      - name: Check patch cleanliness
        run: git diff --check
