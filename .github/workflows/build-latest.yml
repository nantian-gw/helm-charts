name: Build Latest Chart

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Validate chart
        run: |
          bash scripts/validate-chart-production.sh
          bash scripts/test-package-snapshot-charts.sh

      - name: Package chart snapshots
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/package-snapshot-charts.sh

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages 2>/dev/null || true
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          cp .dist/*.tgz .
          rm -rf .dist
          helm repo index . --url "https://charts.nantian.dev"
          if grep -q '\.dist/' index.yaml; then
            echo "index.yaml must not contain unpublished .dist chart URLs" >&2
            exit 1
          fi

          echo "charts.nantian.dev" > CNAME

          git add index.yaml *.tgz CNAME
          git diff --staged --quiet || git commit -m "build latest [skip ci]"
          git push origin gh-pages
