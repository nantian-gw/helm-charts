name: Release Helm Chart

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Verify Gateway API CRDs
        run: bash scripts/verify-gateway-api-crds.sh

      - name: Validate chart
        run: bash scripts/validate-chart-production.sh

      - name: Package chart
        run: |
          mkdir -p .dist
          helm package charts/nantian-gw -d .dist

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch gh-pages or create from scratch
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages 2>/dev/null || true
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          # Copy tgz and generate index
          cp .dist/*.tgz .
          rm -rf .dist
          helm repo index . --url "https://chart.nantian.dev"
          if grep -q '\.dist/' index.yaml; then
            echo "index.yaml must not contain unpublished .dist chart URLs" >&2
            exit 1
          fi

          # Ensure CNAME exists
          echo "chart.nantian.dev" > CNAME

          git add index.yaml *.tgz CNAME
          git diff --staged --quiet || git commit -m "release ${{ github.ref_name }}"
          git push origin gh-pages
