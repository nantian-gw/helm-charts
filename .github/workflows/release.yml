name: Release Helm Chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Package chart
        run: |
          mkdir -p .dist
          helm package charts/nantian-gw -d .dist

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch gh-pages or create from scratch
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages 2>/dev/null || true
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          # Copy tgz and generate index
          cp .dist/*.tgz .
          if [ -f index.yaml ]; then
            helm repo index . --url "https://chart.nantian.dev" --merge index.yaml
          else
            helm repo index . --url "https://chart.nantian.dev"
          fi

          # Ensure CNAME exists
          echo "chart.nantian.dev" > CNAME

          git add index.yaml *.tgz CNAME
          git diff --staged --quiet || git commit -m "release ${{ github.ref_name }}"
          git push origin gh-pages